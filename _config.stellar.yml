plugins:
  katex:
    enable: false
  callout:
    enable: true
    inject: |
      <link rel="stylesheet" href="/css/callout.css">
  mathjax:
    enable: true
    v3: false
    js: https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.6/MathJax.js?config=TeX-AMS-MML_HTMLorMML

# 本地搜索：结果按章节拆分、点击直达锚点并高亮关键词，支持 Ctrl+K 聚焦
search:
  service: local_search

# 文章页显示字数与预计阅读时长
article:
  reading_time: true

logo:
  avatar: '[{config.avatar}](/social/)'

footer:
  content: |
    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。
    全站访问量 <span id="busuanzi_site_pv">-</span> 次 · 访客数 <span id="busuanzi_site_uv">-</span> 人 · 本页面浏览 <span id="busuanzi_page_pv">-</span> 次
    <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>

# # 侧边栏主功能导航菜单
menubar:
  columns: 4
  items:
    - id: post
      theme: '#1BCDFC'
      icon: default:documents
      title: 博客
      url: /
    - id: social
      theme: '#FF8F2C'
      icon: example:planet
      title: 社交
      url: /social/

