# Stellar v2 配置（从 v1 迁移，2026-10-08）
#
# 迁移映射（v1 → v2）：
#   plugins.katex/mathjax      → features.math.provider / features.math.mathjax.js
#   plugins.callout.inject     → inject.head_end
#   search.service             → search.provider
#   article.reading_time       → article.show_reading_time
#   logo.avatar                → leftbar.brand.image.src / leftbar.brand.href
#   menubar                    → leftbar.menu
#   footer.content / sitemap   → footer.content / footer.sitemap（字段名不变）

# -----------------------------------------------------------------
# 数学公式：MathJax v3 客户端渲染（raw-math 保护 $ 定界符不被 markdown-it 破坏）
# -----------------------------------------------------------------
features:
  math:
    provider: mathjax
    mathjax:
      js: https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

# -----------------------------------------------------------------
# 搜索：本地全文搜索（Ctrl+K / Cmd+K）
# -----------------------------------------------------------------
search:
  provider: local

# -----------------------------------------------------------------
# 文章页
# -----------------------------------------------------------------
article:
  show_reading_time: true

# -----------------------------------------------------------------
# 页脚
# -----------------------------------------------------------------
footer:
  content: |
    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。
    全站访问量 <span id="busuanzi_site_pv">-</span> 次 · 访客数 <span id="busuanzi_site_uv">-</span> 人 · 本页面浏览 <span id="busuanzi_page_pv">-</span> 次
    <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
  sitemap: []

# -----------------------------------------------------------------
# 可信内容注入（保留 v1 callout CSS 注入，注入位置从 <head> 末尾改为 </head> 前）
# -----------------------------------------------------------------
inject:
  head_end: |
    <link rel="stylesheet" href="/css/callout.css">

# -----------------------------------------------------------------
# 左栏：Brand + 菜单
# -----------------------------------------------------------------
leftbar:
  brand:
    search: true
    style: regular
    ghuser: null
    image:
      src: https://avatars.githubusercontent.com/u/58620217
      variant: avatar
    name: null
    tagline: null
    href: /social/
  # 菜单路径必须是本站真实路由（Hexo 生成在根目录，不带 /blog/ 前缀）
  menu_columns: 1
  menu:
    - id: post
      title: 博客
      icon: default:documents
      accent: '#1BCDFC'
      url: /
    - id: social
      title: 社交
      icon: example:planet
      accent: '#FF8F2C'
      url: /social/
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
  footer:
    actions: []
